name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Los pasos reales de calidad se activan en el Goal 19, cuando ya hay
      # código y tests que ejecutar. Hasta entonces, CI solo valida que la
      # instalación del workspace es reproducible.
      # - name: Lint
      #   run: pnpm lint
      # - name: Typecheck
      #   run: pnpm typecheck
      # - name: Test
      #   run: pnpm test
      # - name: Build
      #   run: pnpm build
